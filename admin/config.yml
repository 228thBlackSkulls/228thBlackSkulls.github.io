# Editor setup for the 228th Black Skulls Corps website.
# Each "field" below becomes a box in the edit page. Saving writes content.json in the GitHub repo,
# and GitHub Pages republishes the site about a minute later.
backend:
  name: github
  repo: 228thBlackSkulls/228thBlackSkulls.github.io
  branch: main

media_folder: images
public_folder: images

collections:
  - name: site
    label: Website
    editor: { preview: false }
    files:
      - name: content
        label: 228th website content
        file: content.json
        fields:
          - label: Links
            name: links
            widget: object
            fields:
              - { label: "Discord invite link", name: discord_invite, widget: string, hint: "Paste your full invite, like https://discord.gg/abc123" }
              - { label: "Join the Corps button link", name: join_button, widget: string, hint: "Leave as #join to scroll to the How to join section, or paste an application form link" }
          - label: Top of page
            name: hero
            widget: object
            fields:
              - { label: "Small line above the title", name: tagline, widget: string }
              - { label: "Intro paragraph", name: intro, widget: text }
          - label: Stats strip
            name: stats
            widget: list
            summary: "{{value}} – {{label}}"
            fields:
              - { label: "Big text", name: value, widget: string }
              - { label: "Small label", name: label, widget: string }
          - label: Current leadership
            name: leadership
            widget: list
            summary: "{{rank}} {{designation}} {{name}}"
            hint: "The first person in the list gets the red highlighted card."
            fields:
              - { label: Rank, name: rank, widget: string }
              - { label: "Designation (CC number)", name: designation, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Division, name: division, widget: string, required: false }
              - { label: Portrait, name: portrait, widget: image, required: false }
          - label: Founders
            name: founders
            widget: list
            summary: "{{name}} – {{role}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
          - label: Divisions
            name: divisions
            widget: list
            summary: "{{name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Next operation countdown
            name: next_op
            widget: object
            fields:
              - { label: "Operation name", name: name, widget: string }
              - { label: Day, name: day, widget: select, options: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday] }
              - { label: "Start time in UTC (24-hour, like 19:00)", name: time_utc, widget: string, pattern: ['^([01]?\d|2[0-3]):[0-5]\d$', "Use 24-hour time like 19:00"] }
              - { label: "Note under the countdown", name: note, widget: text }
          - label: Weekly schedule
            name: schedule
            widget: list
            summary: "{{day}} {{title}} {{time}}"
            fields:
              - { label: "Day (short, like Sat)", name: day, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Details, name: details, widget: string }
              - { label: "Time (like 1900Z)", name: time, widget: string }
          - label: How to join steps
            name: join_steps
            widget: list
            summary: "{{title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - { label: Requirements, name: requirements, widget: list, field: { label: Requirement, name: item, widget: string } }
          - label: FAQ
            name: faq
            widget: list
            summary: "{{question}}"
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }
          - { label: "Footer motto", name: motto, widget: string }
