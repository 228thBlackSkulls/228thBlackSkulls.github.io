<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* Site update check: phones keep old copies of pages for a while, so each page asks for the current
   version and, if it has changed, reloads itself fresh. Bump the number here and in version.txt on every publish. */
(function(){var v="202610220340";
  var u=new URL(location.href);if(u.searchParams.get("preview")||u.searchParams.get("code")||/access_token|type=recovery/.test(location.hash))return;
  fetch("../version.txt?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).then(function(t){t=t.trim();
    if(!t||t===v||u.searchParams.get("v")===t)return;u.searchParams.set("v",t);location.replace(u.href);}).catch(function(){});})();</script>
<title>My account · 228th Black Skulls Corps</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../auth/auth.css?v=11">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
<script src="../auth/config.js?v=3"></script>
<script src="../auth/auth.js?v=20"></script>
<script src="../auth/fx.js?v=5"></script>
<style>
.me{display:grid;grid-template-columns:120px 1fr;gap:24px;align-items:center}
.me .av{width:120px;height:120px;font-size:2.6rem}
@media (max-width:520px){.me{grid-template-columns:1fr;justify-items:start}}
dialog.crop{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:20px;width:min(92vw,400px)}
dialog.crop::backdrop{background:rgba(0,0,0,.75)}
.stage{position:relative;width:100%;aspect-ratio:1;overflow:hidden;background:#000;touch-action:none;cursor:grab;user-select:none}
.stage:active{cursor:grabbing}
.stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none}
.stage .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 9999px rgba(10,10,11,.62);pointer-events:none}
.zoom{display:flex;gap:10px;align-items:center;font:500 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.zoom input{flex:1;padding:0;accent-color:var(--accent)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="../"><img src="../images/logo-nav.webp" alt="">228th <span>Black Skulls</span></a>
  <nav id="acct-nav" aria-label="Account"></nav>
</div></header>

<main class="wrap">
  <div class="center stack" style="max-width:640px">
    <div class="head">
      <p class="label"><b>//</b> Members</p>
      <h1>My account</h1>
    </div>
    <div class="msg" id="msg" role="status"></div>

    <div class="panel stack" id="out" hidden>
      <p class="muted">Log in to manage your account.</p>
      <a class="btn" href="../login/">Log in</a>
    </div>

    <div class="stack" id="in" hidden>
      <section class="panel me" aria-label="Profile">
        <div id="pic"></div>
        <div class="stack" style="gap:10px">
          <h2 id="name" style="font-size:1.8rem"></h2>
          <p><span class="chip red" id="role"></span></p>
          <p class="muted" style="font-size:.9rem">Only Command can change your name or rank.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <label class="btn small" for="file">Change picture</label>
            <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
            <button class="btn ghost small" type="button" id="remove" hidden>Remove picture</button>
          </div>
        </div>
      </section>

      <form class="panel stack" id="bio-form" aria-labelledby="bio-h">
        <h3 id="bio-h">Bio</h3>
        <label class="f">About you<textarea name="bio" maxlength="1000" placeholder="Your role in the 228th, what you're in charge of, anything members should know about you"></textarea><span class="hint">Shows under your name on the Members roster.</span></label>
        <button class="btn" type="submit">Save bio</button>
      </form>

      <section class="panel stack" aria-labelledby="email-h">
        <h3 id="email-h">Email</h3>
        <p class="muted" id="email"></p>
      </section>

      <form class="panel stack" id="pw" aria-labelledby="pw-h">
        <h3 id="pw-h">Change password</h3>
        <label class="f">New password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <label class="f">Type it again<input name="again" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn" type="submit">Save password</button>
      </form>
    </div>
  </div>
</main>

<dialog class="crop" id="crop" aria-labelledby="crop-h">
  <div class="stack">
    <h3 id="crop-h">Crop your picture</h3>
    <p class="muted" style="font-size:.9rem">Drag to move it. Use the slider (or pinch) to zoom. The circle shows how it will look.</p>
    <div class="stage" id="stage"><img id="crop-img" alt=""><div class="ring"></div></div>
    <label class="zoom">Zoom<input type="range" id="zoom" min="1" max="4" step="0.01" value="1"></label>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn ghost small" type="button" id="crop-cancel">Cancel</button>
      <button class="btn small" type="button" id="crop-save">Save picture</button>
    </div>
  </div>
</dialog>

<script>
(async function () {
  var A = window.Auth, sb = A.sb, msg = document.getElementById('msg'), $ = function (id) { return document.getElementById(id); };
  function ok(text) { msg.className = 'msg ok'; msg.textContent = text; }
  if (!sb) { A.header(null, 'account'); $('out').hidden = false; return; }
  var me;
  try { me = await A.me(); } catch (e) { A.header(null, 'account'); $('out').hidden = false; return A.fail(msg, e); }
  A.header(me, 'account');
  if (!me || me.missing) { $('out').hidden = false; return; }
  $('in').hidden = false;

  function show() {
    $('pic').textContent = ''; $('pic').appendChild(A.avatar(me));
    $('name').textContent = me.display_name || 'Unnamed';
    $('role').textContent = me.status === 'approved' ? A.rankName((me.roles && me.roles.label) || me.role) : 'Pending approval';
    $('remove').hidden = !me.avatar_url;
  }
  await A.loadPrefixes();
  $('email').textContent = me.email || (me.user && me.user.email) || '';
  show();

  $('bio-form').bio.value = me.note || '';
  $('bio-form').onsubmit = async function (e) {
    e.preventDefault();
    var r = await sb.rpc('set_bio', { target: me.id, bio: this.bio.value });
    if (r.error) return A.fail(msg, r.error);
    ok('Bio saved.');
  };

  // Where a stored picture lives inside the avatars bucket, from its public URL.
  function pathOf(url) { var m = url && url.match(/\/object\/public\/avatars\/(.+)$/); return m ? decodeURIComponent(m[1]) : null; }

  // Cropper: the photo sits under a see-through circle; drag to move, slider or pinch to zoom.
  var dlg = $('crop'), stage = $('stage'), cimg = $('crop-img'), zoom = $('zoom');
  var view = { x: 0, y: 0, base: 1, z: 1 }, pts = {}, pinch = null, srcUrl = null;
  function size() { return stage.clientWidth; }
  function clamp() {
    var S = size(), k = view.base * view.z, w = cimg.naturalWidth * k, h = cimg.naturalHeight * k;
    view.x = Math.min(0, Math.max(S - w, view.x)); view.y = Math.min(0, Math.max(S - h, view.y));
  }
  function draw() { clamp(); cimg.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + (view.base * view.z) + ')'; }
  // Zoom around a point on the stage so that spot stays put.
  function setZoom(z, cx, cy) {
    var S = size(); z = Math.min(4, Math.max(1, z));
    if (cx == null) { cx = S / 2; cy = S / 2; }
    var k0 = view.base * view.z, k1 = view.base * z;
    view.x = cx - (cx - view.x) * k1 / k0; view.y = cy - (cy - view.y) * k1 / k0;
    view.z = z; zoom.value = z; draw();
  }
  function openCrop(file) {
    return new Promise(function (done, fail) {
      if (srcUrl) URL.revokeObjectURL(srcUrl);
      srcUrl = URL.createObjectURL(file);
      cimg.onload = function () {
        dlg.showModal();
        var S = size();
        view.base = Math.max(S / cimg.naturalWidth, S / cimg.naturalHeight); view.z = 1; zoom.value = 1;
        view.x = (S - cimg.naturalWidth * view.base) / 2; view.y = (S - cimg.naturalHeight * view.base) / 2;
        draw();
        $('crop-cancel').onclick = function () { dlg.close(); done(null); };
        dlg.oncancel = function () { done(null); };
        $('crop-save').onclick = function () {
          var k = view.base * view.z, c = document.createElement('canvas');
          c.width = c.height = 256;
          c.getContext('2d').drawImage(cimg, -view.x / k, -view.y / k, size() / k, size() / k, 0, 0, 256, 256);
          dlg.close();
          c.toBlob(function (b) { b ? done(b) : fail(new Error('Could not read that picture.')); }, 'image/webp', 0.85);
        };
      };
      cimg.onerror = function () { fail(new Error('That file isn\'t a picture we can use.')); };
      cimg.src = srcUrl;
    });
  }
  zoom.oninput = function () { setZoom(+zoom.value); };
  stage.addEventListener('wheel', function (e) {
    e.preventDefault(); var r = stage.getBoundingClientRect();
    setZoom(view.z * (e.deltaY < 0 ? 1.08 : 1 / 1.08), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  stage.addEventListener('pointerdown', function (e) { stage.setPointerCapture(e.pointerId); pts[e.pointerId] = { x: e.clientX, y: e.clientY }; pinch = null; });
  stage.addEventListener('pointermove', function (e) {
    var p = pts[e.pointerId]; if (!p) return;
    var ids = Object.keys(pts);
    if (ids.length === 1) { view.x += e.clientX - p.x; view.y += e.clientY - p.y; draw(); }
    else if (ids.length === 2) {
      var o = pts[ids[0] == e.pointerId ? ids[1] : ids[0]], d = Math.hypot(e.clientX - o.x, e.clientY - o.y), r = stage.getBoundingClientRect();
      if (pinch) setZoom(view.z * d / pinch, (e.clientX + o.x) / 2 - r.left, (e.clientY + o.y) / 2 - r.top);
      pinch = d;
    }
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
  });
  ['pointerup', 'pointercancel'].forEach(function (t) { stage.addEventListener(t, function (e) { delete pts[e.pointerId]; pinch = null; }); });

  $('file').onchange = async function () {
    var f = this.files[0]; this.value = '';
    if (!f) return;
    try {
      var blob = await openCrop(f);
      if (!blob) return;
      msg.className = 'msg ok'; msg.textContent = 'Uploading…';
      var path = me.id + '/' + Date.now() + '.webp';
      var up = await sb.storage.from('avatars').upload(path, blob, { contentType: 'image/webp' });
      if (up.error) throw up.error;
      var url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl, old = pathOf(me.avatar_url);
      var r = await sb.from('profiles').update({ avatar_url: url }).eq('id', me.id);
      if (r.error) throw r.error;
      if (old) await sb.storage.from('avatars').remove([old]);
      me.avatar_url = url; show(); ok('Picture updated.');
    } catch (e) { A.fail(msg, e); }
  };

  $('remove').onclick = async function () {
    var old = pathOf(me.avatar_url);
    var r = await sb.from('profiles').update({ avatar_url: null }).eq('id', me.id);
    if (r.error) return A.fail(msg, r.error);
    if (old) await sb.storage.from('avatars').remove([old]);
    me.avatar_url = null; show(); ok('Picture removed.');
  };

  $('pw').onsubmit = async function (e) {
    e.preventDefault();
    if (this.password.value !== this.again.value) return A.fail(msg, { message: 'The two passwords don\'t match.' });
    var r = await sb.auth.updateUser({ password: this.password.value });
    if (r.error) return A.fail(msg, r.error);
    this.reset(); ok('Password saved.');
  };
})();
</script>
</body>
</html>
